name: Update follower count

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch follower counts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node fetch-followers.mjs

      - name: Commit updated count
        run: |
          git config user.name "follower-bot"
          git config user.email "actions@github.com"
          git add followers.json
          git diff --staged --quiet || git commit -m "Update follower count"
          git push
